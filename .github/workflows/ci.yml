name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install dependencies
        working-directory: backend
        run: python -m pip install --require-hashes -r requirements.lock.txt
      - name: Run tests
        working-directory: backend
        run: python -m pytest tests -q
      - name: Compile Python
        working-directory: backend
        run: python -m compileall -q app tests

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Run fast unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Validate content and TypeScript
        working-directory: frontend
        run: npm run validate:a1
      - name: Validate isolated A2 pilot
        working-directory: frontend
        run: npm run validate:a2
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Check initial bundle budget
        working-directory: frontend
        run: npm run check:bundle

  python-security:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: backend/requirements.lock.txt
          require-hashes: true

  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Git candidate path controls
        run: node scripts/git-candidate.mjs --self-test
      - name: Check changed lines for whitespace errors
        run: node scripts/run-git-diff-check.mjs "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}"
